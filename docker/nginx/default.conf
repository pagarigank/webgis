# Global per-address throttle (architecture.md §.nginx; per-user buckets live
# in the PHP RateLimitMiddleware — this is only a coarse flood control).
limit_req_zone $binary_remote_addr zone=webgis_api:10m rate=30r/s;

server {
    listen 8080;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    location / {
        limit_req zone=webgis_api burst=100 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
